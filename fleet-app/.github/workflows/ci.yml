name: Android CI Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (JVM)
        run: ./gradlew testDebugUnitTest

      - name: Verify Domain Purity (No android imports)
        run: |
          if grep -rn "import android" app/src/main/java/com/example/fleetapp/domain/; then
            echo "Violação de arquitetura: imports do Android encontrados no domínio!"
            exit 1
          fi